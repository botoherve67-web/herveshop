<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0969ed">
<title>Hors ligne — HerveShop</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:'Segoe UI',Arial,sans-serif;background:#f7faff;color:#173f5f;text-align:center;padding:24px}
  .box{max-width:380px}
  img{width:160px;height:auto;margin-bottom:12px}
  h1{font-size:1.5rem;margin:0 0 8px}
  p{margin:0 0 20px;line-height:1.5}
  button{background:#0969ed;color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <img src="/images/logo.png" alt="HerveShop">
  <h1>Vous êtes hors ligne</h1>
  <p>Vérifiez votre connexion internet puis réessayez.</p>
  <button onclick="location.reload()">Réessayer</button>
</div>
</body>
</html>
